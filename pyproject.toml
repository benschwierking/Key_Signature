[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "key-signature-classifier"
version = "0.1.0"
description = "A reproducible chroma-based song key-signature classifier"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "Ben Schwierking" }]
dependencies = [
  "altair>=5",
  "joblib>=1.3",
  "librosa>=0.11",
  "matplotlib>=3.8",
  "music21>=9",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "requests>=2.31",
  "scikit-learn>=1.5",
  "scipy>=1.12",
  "soundfile>=0.12",
  "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]

[project.scripts]
keyclf-features = "keyclf.features:main"
keyclf-train = "keyclf.train:main"

[tool.setuptools.packages.find]
include = ["keyclf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "impl: needs the keyclf implementation",
  "artifacts: needs cached features and a model",
  "harness: harness self-test",
  "interface_heuristic: interface naming heuristic",
]
